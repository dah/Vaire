[package]
name = "agentharness"
version = "0.1.0"
edition = "2021"
description = "Conversation-focused Codex app-server harness"

[dependencies]
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
